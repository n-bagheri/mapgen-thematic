<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MapGen Focus</title>
  <link rel="stylesheet" href="/minimal.css?v=focus-9">
</head>
<body class="nav-open">
  <a class="skip-link" href="#control-pane">Skip to map controls</a>

  <button class="icon-button nav-toggle" id="nav-toggle" type="button"
          aria-controls="project-nav" aria-expanded="true" aria-label="Close map library">
    <span class="menu-glyph" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <button class="nav-backdrop" id="nav-backdrop" type="button" aria-label="Close map library" tabindex="-1"></button>
  <aside class="project-nav" id="project-nav" aria-label="Map library">
    <div class="nav-heading">
      <h1>Maps</h1>
      <button class="button primary small" id="nav-add-map" type="button">New map</button>
    </div>
    <nav class="project-list" id="project-list" aria-label="Available maps"></nav>
    <div class="nav-empty" id="nav-empty" hidden>
      <span aria-hidden="true">+</span>
      <p>Add a PNG or JPG map to begin.</p>
    </div>
    <div class="project-tools" id="project-tools" hidden>
      <button class="button subtle small" id="rename-project" type="button">Rename</button>
      <button class="button danger small" id="delete-project" type="button">Delete</button>
    </div>
    <footer class="nav-footer">
      <a href="/">Open all steps</a>
    </footer>
  </aside>

  <main class="workspace" id="workspace">
    <section class="visual-pane" id="visual-pane" aria-label="Map previews" tabindex="-1">
      <div class="welcome-card" id="welcome-card">
        <h2>Choose a map</h2>
      </div>
      <div class="visual-content" id="visual-content" hidden></div>
    </section>

    <aside class="control-pane" id="control-pane" aria-label="Map controls">
      <div id="control-content" hidden></div>
    </aside>
  </main>

  <input class="visually-hidden" id="upload-input" type="file" accept=".png,.jpg,.jpeg">
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/minimal/main.js?v=focus-9"></script>
</body>
</html>
